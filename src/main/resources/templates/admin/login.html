<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – My Blog</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 6rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #555; }
        input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 0.5rem 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1rem; }
        button { width: 100%; padding: 0.6rem; font-size: 1rem; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        .error { background: #fdd; border: 1px solid #c00; padding: 0.6rem 1rem; margin-bottom: 1.2rem; border-radius: 4px; font-size: 0.9rem; }
        .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.9rem; color: #555; text-decoration: none; }
        .back-link:hover { color: #222; }
    </style>
</head>
<body>
<h1>Admin Login</h1>

<div th:if="${param.error}" class="error">Invalid username or password.</div>

<form th:action="@{/admin/login}" method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">

    <button type="submit">Log in</button>
</form>

<a class="back-link" th:href="@{/}">&larr; Back to blog</a>
</body>
</html>
