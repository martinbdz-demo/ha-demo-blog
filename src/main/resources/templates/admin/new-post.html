<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post – My Blog</title>
    <style>
        body { font-family: sans-serif; max-width: 760px; margin: 0 auto; padding: 2rem 1rem; color: #222; }
        header { border-bottom: 2px solid #222; margin-bottom: 2rem; padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
        h1 { margin: 0; font-size: 1.5rem; }
        header a { font-size: 0.9rem; color: #555; text-decoration: none; }
        header a:hover { color: #222; }
        label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #555; }
        input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 0.5rem 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1.2rem; font-family: inherit; }
        textarea { min-height: 300px; resize: vertical; }
        .field-error { color: #c00; font-size: 0.85rem; margin-top: -1rem; margin-bottom: 1rem; }
        button[type=submit] { padding: 0.6rem 1.5rem; font-size: 1rem; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button[type=submit]:hover { background: #444; }
    </style>
</head>
<body>
<header>
    <h1>New Post</h1>
    <a th:href="@{/admin}">&larr; Dashboard</a>
</header>

<form th:action="@{/admin/posts}" th:object="${post}" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" th:field="*{title}" placeholder="Post title" autofocus>
    <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

    <label for="excerpt">Excerpt <small style="color:#aaa">(shown on front page, max 500 chars)</small></label>
    <input type="text" id="excerpt" th:field="*{excerpt}" placeholder="A short summary of the post">
    <div class="field-error" th:if="${#fields.hasErrors('excerpt')}" th:errors="*{excerpt}"></div>

    <label for="content">Content</label>
    <textarea id="content" th:field="*{content}" placeholder="Full post content..."></textarea>
    <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>

    <button type="submit">Publish</button>
</form>
</body>
</html>
