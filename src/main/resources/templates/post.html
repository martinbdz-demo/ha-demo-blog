<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title + ' – My Blog'}">Post – My Blog</title>
    <style>
        body { font-family: Georgia, serif; max-width: 760px; margin: 0 auto; padding: 2rem 1rem; color: #222; }
        header { border-bottom: 2px solid #222; margin-bottom: 2rem; padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
        h1 { margin: 0; font-size: 2rem; }
        header a { font-family: sans-serif; font-size: 0.9rem; color: #555; text-decoration: none; }
        header a:hover { color: #222; }
        .post-title { font-size: 2rem; margin: 0 0 0.4rem; }
        .post-meta { font-family: sans-serif; font-size: 0.85rem; color: #777; margin-bottom: 2rem; }
        .post-content { line-height: 1.8; white-space: pre-wrap; }
        .back-link { display: inline-block; margin-top: 2.5rem; font-family: sans-serif; font-size: 0.9rem; color: #555; text-decoration: none; }
        .back-link:hover { color: #222; }
    </style>
</head>
<body>
<header>
    <h1>My Blog</h1>
    <a th:href="@{/admin}">Admin</a>
</header>

<article>
    <h2 class="post-title" th:text="${post.title}">Title</h2>
    <div class="post-meta" th:text="${#temporals.format(post.createdAt, 'dd MMMM yyyy')}">Date</div>
    <div class="post-content" th:text="${post.content}">Content</div>
</article>

<a class="back-link" th:href="@{/}">&larr; All posts</a>
</body>
</html>
