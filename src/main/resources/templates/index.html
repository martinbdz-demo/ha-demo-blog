<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        body { font-family: Georgia, serif; max-width: 760px; margin: 0 auto; padding: 2rem 1rem; color: #222; }
        header { border-bottom: 2px solid #222; margin-bottom: 2rem; padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
        h1 { margin: 0; font-size: 2rem; }
        nav a { font-family: sans-serif; font-size: 0.9rem; color: #555; text-decoration: none; }
        nav a:hover { color: #222; }
        .post-entry { margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid #ddd; }
        .post-entry:last-child { border-bottom: none; }
        .post-entry h2 { margin: 0 0 0.3rem; font-size: 1.5rem; }
        .post-entry h2 a { color: #222; text-decoration: none; }
        .post-entry h2 a:hover { text-decoration: underline; }
        .post-meta { font-family: sans-serif; font-size: 0.85rem; color: #777; margin-bottom: 0.8rem; }
        .post-entry p { margin: 0; line-height: 1.7; }
        .empty { color: #777; font-style: italic; }
        .flash-error { background: #fdd; border: 1px solid #c00; padding: 0.6rem 1rem; margin-bottom: 1.5rem; border-radius: 4px; font-family: sans-serif; font-size: 0.9rem; }
    </style>
</head>
<body>
<header>
    <h1>My Blog</h1>
    <nav><a th:href="@{/admin}">Admin</a></nav>
</header>

<div th:if="${error}" class="flash-error" th:text="${error}"></div>

<main>
    <div th:if="${#lists.isEmpty(posts)}" class="empty">No posts yet.</div>
    <div th:each="post : ${posts}" class="post-entry">
        <h2><a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">Post Title</a></h2>
        <div class="post-meta" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</div>
        <p th:text="${post.excerpt}">Excerpt</p>
    </div>
</main>
</body>
</html>
